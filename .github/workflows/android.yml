name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare web assets
        run: |
          cd android-app
          mkdir -p www
          cp ../index.html ../style.css ../app.js ../manifest.webmanifest www/
          cp -r ../icons ../fonts ../data www/
          npm install
          npx cap add android
          npx cap sync android
      - name: Native resources (sounds, icons, permissions)
        run: |
          cd android-app/android/app/src/main
          mkdir -p res/raw
          for v in aaqib sabah makkah; do cp ../../../../../audio/adhan-$v.mp3 res/raw/adhan_$v.mp3; done
          rm -rf res/mipmap-anydpi-v26 res/drawable-v24 res/drawable/ic_launcher_background.xml
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          root='../../../../../icons/'
          for n,sz in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              import os; os.makedirs('res/mipmap-'+n,exist_ok=True)
              im=Image.open(root+'maskable-512.png').convert('RGBA').resize((sz,sz),Image.LANCZOS)
              for f in ('ic_launcher','ic_launcher_round','ic_launcher_foreground'): im.save(f'res/mipmap-{n}/{f}.png')
          os.makedirs('res/drawable',exist_ok=True)
          g=Image.open(root+'icon-192.png').convert('RGBA').resize((96,96),Image.LANCZOS)
          w=Image.new('RGBA',g.size,(255,255,255,0)); w.putalpha(g.getchannel('A')); wh=Image.new('RGBA',g.size,(255,255,255,255)); wh.putalpha(g.getchannel('A')); wh.save('res/drawable/ic_stat_hayatak.png')
          PY
          cp ../../../../native/iqama_soft.wav ../../../../native/pre_soft.wav res/raw/
          JD=java/com/hayatak/salah; mkdir -p $JD; cp ../../../../native/SettingsOpener.java ../../../../native/MainActivity.java $JD/
          M=AndroidManifest.xml
          for p in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED REQUEST_IGNORE_BATTERY_OPTIMIZATIONS VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$p\"" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" $M
          done
          sed -i 's#<resources>#<resources>#' res/values/strings.xml
          cat $M | head -40
      - name: Build release APK
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
      - name: Sign
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > /tmp/hayatak.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android-app/android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$IN" /tmp/aligned.apk
          $BT/apksigner sign --ks /tmp/hayatak.jks --ks-pass env:KS_PASS --ks-key-alias hayatak --out hayatak.apk /tmp/aligned.apk
          $BT/apksigner verify hayatak.apk
          ls -la hayatak.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest hayatak.apk --clobber
            gh release edit android-latest --notes "APK for direct install. Run ${{ github.run_number }}"
          else
            gh release create android-latest hayatak.apk --title "Hayatak Android" --notes "APK for direct install. Run ${{ github.run_number }}" --latest
          fi
