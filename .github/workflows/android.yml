name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare web assets
        run: |
          cd android-app
          mkdir -p www
          cp ../index.html ../style.css ../app.js ../manifest.webmanifest www/
          cp -r ../icons ../fonts ../data www/
          npm install
          npx cap add android
          npx cap sync android
      - name: Native resources (sounds, icons, permissions)
        run: |
          cd android-app/android/app/src/main
          mkdir -p res/raw
          for v in aaqib sabah makkah; do cp ../../../../../audio/adhan-$v.mp3 res/raw/adhan_$v.mp3; done
          rm -rf res/mipmap-anydpi-v26 res/drawable-v24 res/drawable/ic_launcher_background.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p res/mipmap-$n
            convert ../../../../../icons/maskable-512.png -resize ${s}x${s} res/mipmap-$n/ic_launcher.png
            cp res/mipmap-$n/ic_launcher.png res/mipmap-$n/ic_launcher_round.png
            cp res/mipmap-$n/ic_launcher.png res/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p res/drawable
          convert ../../../../../icons/icon-192.png -channel RGB -evaluate set 100% +channel -resize 96x96 res/drawable/ic_stat_hayatak.png
          M=AndroidManifest.xml
          for p in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$p\"" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" $M
          done
          sed -i 's#<resources>#<resources>#' res/values/strings.xml
          cat $M | head -40
      - name: Build release APK
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
      - name: Sign
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > /tmp/hayatak.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android-app/android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$IN" /tmp/aligned.apk
          $BT/apksigner sign --ks /tmp/hayatak.jks --ks-pass env:KS_PASS --ks-key-alias hayatak --out hayatak.apk /tmp/aligned.apk
          $BT/apksigner verify hayatak.apk
          ls -la hayatak.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest hayatak.apk --title "حياتك في الصلاة (Android)" --notes "APK for direct install. Run ${{ github.run_number }}" --latest
